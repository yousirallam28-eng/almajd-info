<style>

const SUPABASE_URL='https://junarautrwrpgzdnpkcj.supabase.co',SUPABASE_KEY='sb_publishable_A4CAShME4nUreFQjP3Mh5w_S7slkwkt',CLOUD_ROW_ID='default';

const STORE_KEY='infoVault.data.v1',VERSION=2,ADMIN={id:'account-admin-root',username:'admin',password:'admin123',role:'admin',protected:true,createdAt:'2026-01-01T00:00:00.000Z'};
const roleNames={admin:'أدمن',manager:'مدير',supervisor:'مشرف',worker:'عامل'},CONTENT_ROLES=['admin','manager','supervisor'],STATUS={available:{label:'متوفر',cls:'status-available'},sold:{label:'تم البيع',cls:'status-sold'},unavailable:{label:'غير متوفر حاليًا',cls:'status-unavailable'}};
let state=null,session=null,currentPage='home',activeGroup=null,activeSection=null,sidebarOpen=false,editingAccount=null,networkScale=1,networkPan={x:0,y:0},drag=null;

function defaultState(){return {version:VERSION,accounts:[{...ADMIN}],groups:[],sections:[],items:[],settings:{}}}
const db={load(){try{const raw=localStorage.getItem(STORE_KEY);if(!raw){const fresh=defaultState();this.save(fresh);return fresh}const p=JSON.parse(raw);if(!p||typeof p!=='object'||!Array.isArray(p.accounts)||!Array.isArray(p.groups)||!Array.isArray(p.sections)||!Array.isArray(p.items))throw Error('هيكل البيانات غير صالح');const fixed={version:VERSION,accounts:p.accounts.filter(x=>x&&typeof x==='object'),groups:p.groups.filter(x=>x&&typeof x==='object'),sections:p.sections.filter(x=>x&&typeof x==='object').map(x=>({...x,parentSectionId:x.parentSectionId||null})),items:p.items.filter(x=>x&&typeof x==='object').map(x=>({...x,status:STATUS[x.status]?x.status:'available',details:x.details&&typeof x.details==='object'?x.details:{}})),settings:p.settings&&typeof p.settings==='object'?p.settings:{}};const root=fixed.accounts.find(x=>x.id===ADMIN.id);if(!root)fixed.accounts.unshift({...ADMIN});else Object.assign(root,ADMIN);return fixed}catch(e){console.error('Storage load:',e);throw e}},save(next){try{localStorage.setItem(STORE_KEY,JSON.stringify(next));state=next;queueCloudSave(next);return true}catch(e){toast(e&&e.name==='QuotaExceededError'?'تعذّر الحفظ: مساحة التخزين ممتلئة.':'تعذّر الوصول إلى التخزين المحلي.',true);return false}},accounts(){return state.accounts},groups(){return state.groups},sections(g,p=null){return state.sections.filter(x=>x.groupId===g&&(x.parentSectionId||null)===(p||null))},items(s){return state.items.filter(x=>x.sectionId===s)},addAccount(v){return mutate(s=>s.accounts.push(v))},updateAccount(id,patch){return mutate(s=>{const i=s.accounts.findIndex(x=>x.id===id);if(i<0)throw Error('الحساب غير موجود');Object.assign(s.accounts[i],patch)})},deleteAccount(id){return mutate(s=>{s.accounts=s.accounts.filter(x=>x.id!==id)})},addGroup(v){return mutate(s=>s.groups.push(v))},updateGroup(id,patch){return mutate(s=>{const x=s.groups.find(x=>x.id===id);if(!x)throw Error('المجموعة غير موجودة');Object.assign(x,patch)})},deleteGroup(id){return mutate(s=>{const doomed=new Set(s.sections.filter(x=>x.groupId===id).map(x=>x.id));let changed=true;while(changed){changed=false;for(const x of s.sections)if(x.parentSectionId&&doomed.has(x.parentSectionId)&&!doomed.has(x.id)){doomed.add(x.id);changed=true}}s.items=s.items.filter(x=>!doomed.has(x.sectionId));s.sections=s.sections.filter(x=>!doomed.has(x.id));s.groups=s.groups.filter(x=>x.id!==id)})},addSection(v){return mutate(s=>s.sections.push({...v,parentSectionId:v.parentSectionId||null}))},updateSection(id,patch){return mutate(s=>{const x=s.sections.find(x=>x.id===id);if(!x)throw Error('القسم غير موجود');Object.assign(x,patch)})},deleteSection(id){return mutate(s=>{const doomed=new Set([id]);let changed=true;while(changed){changed=false;for(const x of s.sections)if(x.parentSectionId&&doomed.has(x.parentSectionId)&&!doomed.has(x.id)){doomed.add(x.id);changed=true}}s.items=s.items.filter(x=>!doomed.has(x.sectionId));s.sections=s.sections.filter(x=>!doomed.has(x.id))})},addItem(v){return mutate(s=>s.items.push({...v,status:STATUS[v.status]?v.status:'available'}))},updateItem(id,patch){return mutate(s=>{const x=s.items.find(x=>x.id===id);if(!x)throw Error('العنصر غير موجود');Object.assign(x,patch)})},deleteItem(id){return mutate(s=>{s.items=s.items.filter(x=>x.id!==id)})}};
async function cloudSave(next){if(!cloudClient)return;try{const {error}=await cloudClient.from('info_vault_state').upsert({id:CLOUD_ROW_ID,payload:next,updated_at:new Date().toISOString()});if(error)throw error}catch(e){console.warn('Cloud sync:',e.message||e)}}
function queueCloudSave(next){if(!cloudReady||!cloudClient)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudSave(next),250)}
async function syncCloud(){if(!cloudClient){cloudReady=true;return}try{const {data,error}=await cloudClient.from('info_vault_state').select('payload').eq('id',CLOUD_ROW_ID).maybeSingle();if(error)throw error;if(data?.payload){state=data.payload;localStorage.setItem(STORE_KEY,JSON.stringify(state))}else if(state)await cloudSave(state)}catch(e){console.warn('Cloud load:',e.message||e)}finally{cloudReady=true}}
function mutate(fn){const next=structuredClone(state);try{fn(next)}catch(e){toast(e.message||'تعذّرت العملية',true);return false}return db.save(next)}function uid(){return crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}function norm(s){return String(s||'').normalize('NFKC').trim().replace(/\s+/g,' ').toLocaleLowerCase('ar')}function escape(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function requireRole(roles=CONTENT_ROLES){if(!session||!roles.includes(session.role)){toast('غير مصرح: لا تملك صلاحية تنفيذ هذه العملية.',true);return false}return true}function requireAdmin(){return requireRole(['admin'])}function canManage(){return !!session&&CONTENT_ROLES.includes(session.role)}function toast(text,bad=false){const el=document.createElement('div');el.className='toast'+(bad?' bad':'');el.textContent=text;$('#toastHost').appendChild(el);setTimeout(()=>el.remove(),3600)}function msg(text,type='error'){return `<div class="message ${type}" role="status">${escape(text)}</div>`}function empty(title,detail){return `<div class="empty"><strong>${escape(title)}</strong>${escape(detail||'')}</div>`}function btn(label,action,cls='secondary',extra=''){return `<button class="btn ${cls} ${extra}" data-action="${action}">${label}</button>`}function statusBadge(status){const s=STATUS[status]||STATUS.available;return `<span class="status ${s.cls}">${s.label}</span>`}function imageHtml(it,cls='item-image'){return it.image?`<img class="${cls}" src="${escape(it.image)}" alt="${escape(it.name)}" data-image="${escape(it.image)}">`:''}

function drawNetwork(){const stage=$('#networkStage');if(!stage)return;const gid=$('#networkGroup').value,g=state.groups.find(x=>x.id===gid),q=norm($('#networkSearch')?.value);if(!g){stage.innerHTML='<div class="network-empty">لا توجد مجموعة لعرضها.</div>';return}const roots=db.sections(g.id),filtered=q?state.sections.filter(s=>norm(s.name).includes(q)||db.items(s.id).some(i=>norm(i.name).includes(q))):roots;stage.innerHTML=`<div class="network-canvas" id="networkCanvas"><svg class="network-lines" id="networkLines" aria-hidden="true"></svg><div class="tree-root"><div class="tree-node root" data-node-id="${escape(g.id)}">${escape(g.name)}</div>${filtered.length?`<div class="tree-children">${filtered.map(treeSection).join('')}</div>`:'<div class="network-empty">لا توجد نتائج مطابقة داخل هذه المجموعة.</div>'}</div></div>`;const c=$('#networkCanvas');c.style.transform=`translate(${networkPan.x}px,${networkPan.y}px) scale(${networkScale})`;requestAnimationFrame(drawConnections)}
function drawConnections(){const c=$('#networkCanvas'),svg=$('#networkLines');if(!c||!svg)return;const cb=c.getBoundingClientRect(),scale=networkScale||1;const nodes=[...c.querySelectorAll('[data-node-id]')],byId=new Map(nodes.map(n=>[n.dataset.nodeId,n]));const w=Math.max(c.scrollWidth,cb.width/scale),h=Math.max(c.scrollHeight,cb.height/scale);svg.setAttribute('width',w);svg.setAttribute('height',h);svg.setAttribute('viewBox',`0 0 ${w} ${h}`);let out='';for(const n of nodes){const p=byId.get(n.dataset.parentId);if(!p)continue;const nr=n.getBoundingClientRect(),pr=p.getBoundingClientRect(),x1=(pr.left+pr.width/2-cb.left)/scale,y1=(pr.bottom-cb.top)/scale,x2=(nr.left+nr.width/2-cb.left)/scale,y2=(nr.top-cb.top)/scale,dy=Math.max(28,(y2-y1)*.45);out+=`<path d="M ${x1} ${y1} C ${x1} ${y1+dy}, ${x2} ${y2-dy}, ${x2} ${y2}"/><circle cx="${x1}" cy="${y1}" r="3"/><circle cx="${x2}" cy="${y2}" r="3"/>`}svg.innerHTML=out}
function zoomNetwork(f){networkScale=Math.max(.35,Math.min(2.5,networkScale*f));drawNetwork()}function fitNetwork(){networkScale=1;networkPan={x:0,y:0};drawNetwork()}function bindPan(){const s=$('#networkStage');s.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,px:networkPan.x,py:networkPan.y};s.classList.add('dragging');s.setPointerCapture(e.pointerId)};s.onpointermove=e=>{if(!drag)return;networkPan.x=drag.px+e.clientX-drag.x;networkPan.y=drag.py+e.clientY-drag.y;const c=$('#networkCanvas');if(c)c.style.transform=`translate(${networkPan.x}px,${networkPan.y}px) scale(${networkScale})`};s.onpointerup=s.onpointercancel=()=>{drag=null;s.classList.remove('dragging')};s.onwheel=e=>{e.preventDefault();zoomNetwork(e.deltaY<0?1.1:.9)}}
window.addEventListener('resize',()=>{if(currentPage==='network')requestAnimationFrame(drawConnections)});main.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;switch(a){case'home':goHome();break;case'admin':openAdmin();break;case'open-group':renderGroup(id);break;case'open-section':renderSection(id);break;case'network-item':{const it=state.items.find(x=>x.id===id);if(it)openItemDetails(it);break}case'image-open':{const it=state.items.find(x=>x.id===id);if(it?.image)openImage(it.image);break}case'add-account':{if(!requireAdmin())return;const u=$('#accountName').value.trim(),p=$('#accountPassword').value,r=$('#accountRole').value;if(!u||!p||!['admin','manager','supervisor','worker'].includes(r)){toast('يرجى تعبئة بيانات الحساب بدقة.',true);return}if(db.accounts().some(x=>norm(x.username)===norm(u))){toast('اسم المستخدم مستخدم بالفعل.',true);return}if(db.addAccount({id:uid(),username:u,password:p,role:r,protected:false,createdAt:new Date().toISOString()})){clearAccountForm();renderAccounts();toast('تمت إضافة الحساب بنجاح.')}break}case'select-account':startEditAccount(id);break;case'save-account-edit':{if(!requireAdmin()||!editingAccount)return;const old=state.accounts.find(x=>x.id===editingAccount);const u=$('#accountName').value.trim(),p=$('#accountPassword').value,r=$('#accountRole').value;if(!old||old.protected||!u||!p||!['admin','manager','supervisor','worker'].includes(r)){toast('لا يمكن تعديل هذا الحساب أو البيانات غير صالحة.',true);return}if(db.accounts().some(x=>x.id!==old.id&&norm(x.username)===norm(u))){toast('اسم المستخدم مستخدم بالفعل.',true);return}if(db.updateAccount(old.id,{username:u,password:p,role:r})){clearAccountForm();renderAccounts();toast('تم تحديث الحساب.')}break}case'delete-account-selected':{if(!requireAdmin()||!editingAccount)return;const a=state.accounts.find(x=>x.id===editingAccount);if(!a||a.protected){toast('لا يمكن حذف الحساب الأساسي.',true);return}confirmDialog('حذف الحساب',`هل تريد حذف الحساب «${a.username}»؟`,()=>{if(requireAdmin()&&db.deleteAccount(a.id)){clearAccountForm();renderAccounts();toast('تم حذف الحساب.')}});break}case'cancel-account':if(requireAdmin())clearAccountForm();break;case'add-group':{if(!requireRole())return;const n=$('#groupName').value.trim();if(!n||db.groups().some(x=>norm(x.name)===norm(n))){toast('اسم المجموعة مطلوب وغير مكرر.',true);return}if(db.addGroup({id:uid(),name:n,createdAt:new Date().toISOString()})){renderGroups();$('#groupName').value='';toast('تمت إضافة المجموعة.')}break}case'rename-group':{if(!requireRole())return;const g=state.groups.find(x=>x.id===id);if(!g)return;promptDialog('تعديل اسم المجموعة','اسم المجموعة',g.name,v=>{if(!requireRole())return;if(!v||db.groups().some(x=>x.id!==id&&norm(x.name)===norm(v))){toast('الاسم مطلوب وغير مكرر.',true);return}if(db.updateGroup(id,{name:v})){renderGroups();toast('تم تعديل اسم المجموعة.')}});break}case'delete-group':{if(!requireRole())return;const g=state.groups.find(x=>x.id===id);if(!g)return;confirmDialog('حذف المجموعة',`سيؤدي ذلك إلى حذف «${g.name}» وجميع أقسامها وعناصرها. هل تريد المتابعة؟`,()=>{if(requireRole()&&db.deleteGroup(id)){renderGroups();toast('تم حذف المجموعة ومحتوياتها.')}});break}case'open-manage-group':if(requireRole())renderManageGroup(id);break;case'add-section':{if(!requireRole())return;const n=$('#sectionName').value.trim();if(!n||db.sections(activeGroup).some(x=>norm(x.name)===norm(n))){toast('اسم القسم مطلوب وغير مكرر.',true);return}if(db.addSection({id:uid(),groupId:activeGroup,parentSectionId:null,name:n,createdAt:new Date().toISOString()})){renderSections(activeGroup);$('#sectionName').value='';toast('تمت إضافة القسم.')}break}case'rename-section':{if(!requireRole())return;const s=state.sections.find(x=>x.id===id);if(!s)return;promptDialog('تعديل اسم القسم','اسم القسم',s.name,v=>{if(!requireRole())return;if(!v||db.sections(s.groupId,s.parentSectionId).some(x=>x.id!==id&&norm(x.name)===norm(v))){toast('الاسم مطلوب وغير مكرر.',true);return}if(db.updateSection(id,{name:v})){s.parentSectionId?renderSection(s.parentSectionId):renderSections(activeGroup);toast('تم تعديل اسم القسم.')}});break}case'delete-section':{if(!requireRole())return;const s=state.sections.find(x=>x.id===id);if(!s)return;confirmDialog('حذف القسم',`سيؤدي ذلك إلى حذف «${s.name}» وجميع محتوياته المتداخلة. هل تريد المتابعة؟`,()=>{if(requireRole()&&db.deleteSection(id)){s.parentSectionId?renderSection(s.parentSectionId):renderSections(activeGroup);toast('تم حذف القسم ومحتوياته.')}});break}case'manage-section':if(requireRole())renderSection(id);break;case'add-child-section':{if(!requireRole())return;const p=state.sections.find(x=>x.id===activeSection);if(!p)return;promptDialog('إضافة قسم فرعي','اسم القسم الفرعي','',v=>{if(!requireRole())return;if(!v||db.sections(p.groupId,p.id).some(x=>norm(x.name)===norm(v))){toast('الاسم مطلوب وغير مكرر.',true);return}if(db.addSection({id:uid(),groupId:p.groupId,parentSectionId:p.id,name:v,createdAt:new Date().toISOString()})){renderSection(p.id);toast('تمت إضافة القسم الفرعي.')}});break}case'add-item':if(requireRole())itemDialog(null,v=>{if(db.items(activeSection).some(x=>norm(x.name)===norm(v.name))){toast('يوجد عنصر بالاسم نفسه في هذا القسم.',true);return}if(db.addItem({id:uid(),sectionId:activeSection,...v,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()})){renderSection(activeSection);toast('تمت إضافة العنصر.')}});break;case'edit-item':{if(!requireRole())return;const it=state.items.find(x=>x.id===id);if(it)itemDialog(it,v=>{if(db.items(it.sectionId).some(x=>x.id!==id&&norm(x.name)===norm(v.name))){toast('يوجد عنصر بالاسم نفسه.',true);return}if(db.updateItem(id,{...v,updatedAt:new Date().toISOString()})){renderSection(it.sectionId);toast('تم تحديث العنصر.')}});break}case'delete-item':{if(!requireRole())return;const it=state.items.find(x=>x.id===id);if(!it)return;confirmDialog('حذف العنصر',`هل تريد حذف «${it.name}»؟`,()=>{if(requireRole()&&db.deleteItem(id)){renderSection(activeSection);toast('تم حذف العنصر.')}});break}}});
window.openAdminPanel=openAdmin;window.addStorageGroup=name=>{if(!requireRole())return false;name=String(name||'').trim();if(!name||db.groups().some(x=>norm(x.name)===norm(name)))return false;return db.addGroup({id:uid(),name,createdAt:new Date().toISOString()})};try{state=db.load()}catch(e){$('#loginMessage').innerHTML=msg('تعذّر بدء التخزين المحلي.');state=defaultState()}syncCloud()})();
</script></body></html>
